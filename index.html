<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>حين تتحدث الدوال بلغة المشاعر</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <a-scene world-environment atmosphere>
      <a-entity tuwaiq-terrain></a-entity>
      <a-entity trail-path></a-entity>
      <a-entity station-list></a-entity>

      <!-- Player rig: walking (player-move) on desktop. Camera at eye height 1.6 m. -->
      <a-entity id="rig" player-move>
        <a-entity
          camera="near: 0.1; far: 6000"
          look-controls="pointerLockEnabled: true"
          position="0 1.6 0"
        ></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
